name: Max Auto-Poster

on:
  workflow_dispatch: # Оставляем твой любимый триггер для крона

permissions:
  contents: write # Разрешаем боту сохранять текстовые файлы в репозиторий

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests google-generativeai beautifulsoup4

      - name: Run Max Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python max_bot.py

      - name: Commit and save posts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🔥 Добавлен новый хлесткий пост для Макса" || echo "Нет новых постов для сохранения"
          git push
